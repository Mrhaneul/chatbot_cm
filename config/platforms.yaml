# config/platforms.yaml
# ---------------------------------------------------------------------------
# Source of truth for platform detection in the routing layer.
# Ingest/retrieval keywords live in app/rag/platforms.yaml (do not modify).
#
# Schema per entry:
#   key                    : uppercase internal key used by app/main.py
#   rag_key                : lowercase key matching app/rag/platforms.yaml
#   metadata_key           : (optional) key used by metadata_filtering.py;
#                            defaults to key.lower() when absent
#   display_name           : human-readable name shown in logs and API responses
#   publisher_list_position: (optional) position in the numbered publisher list
#   publisher_list_label   : (optional) label shown in the numbered publisher list
#   retrieval_key          : (optional) FAISS index key override (for platforms
#                            that share another platform's index)
#   aliases                : lowercase strings for user-message detection (main.py)
#   metadata_aliases       : (optional) lowercase strings for metadata_filtering.py;
#                            omit to exclude this platform from metadata classification
#
# Ordered so that metadata_aliases platforms appear first, matching the original
# detection priority in app/rag/metadata_filtering.py.
# ---------------------------------------------------------------------------

platforms:
  - key: MCGRAW_HILL
    rag_key: mcgraw
    metadata_key: mcgraw_hill
    display_name: "McGraw Hill Connect"
    publisher_list_position: 5
    publisher_list_label: "McGraw Hill (Connect)"
    aliases:
      - mcgraw
      - mcgraw hill
      - connect
      - aleks
    metadata_aliases:
      - mcgraw hill
      - mcgraw
      - connect

  - key: VITALSOURCE
