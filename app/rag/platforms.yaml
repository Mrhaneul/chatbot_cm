# platforms.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for platform detection in both ingest.py and
# retriever.py.  To add a new platform, append a new entry here — no code
# changes needed anywhere else.
#
# Schema per entry:
#   key          : internal snake_case identifier (used for file paths)
#   display_name : human-readable name (used in logs and API responses)
#   keywords     : list of lowercase strings; a chunk/file matches this
#                  platform when ANY keyword appears in its text or filename.
# ─────────────────────────────────────────────────────────────────────────────

platforms:
  - key: cengage
    display_name: Cengage MindTap
    keywords:
      - cengage
      - mindtap

